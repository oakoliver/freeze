<text x="20.00px" y="36.80px" xml:space="preserve"><tspan fill="#ff79c6">module</tspan> Main <tspan fill="#ff79c6">where</tspan>
</text><text x="20.00px" y="53.60px" xml:space="preserve">
</text><text x="20.00px" y="70.40px" xml:space="preserve"><tspan fill="#ff79c6">import</tspan> Data.Function ( (<tspan fill="#ff79c6">&amp;</tspan>) )
</text><text x="20.00px" y="87.20px" xml:space="preserve"><tspan fill="#ff79c6">import</tspan> Data.List ( <tspan fill="#50fa7b">intercalate</tspan> )
</text><text x="20.00px" y="104.00px" xml:space="preserve">
</text><text x="20.00px" y="120.80px" xml:space="preserve"><tspan fill="#50fa7b">hello</tspan> <tspan fill="#ff79c6">::</tspan> <tspan fill="#8be9fd">String</tspan> <tspan fill="#ff79c6">-&gt;</tspan> <tspan fill="#8be9fd">String</tspan>
</text><text x="20.00px" y="137.60px" xml:space="preserve"><tspan fill="#50fa7b">hello</tspan> s <tspan fill="#ff79c6">=</tspan>
</text><text x="20.00px" y="154.40px" xml:space="preserve">  <tspan fill="#f1fa8c">&quot;Hello, &quot;</tspan> <tspan fill="#ff79c6">++</tspan> s <tspan fill="#ff79c6">++</tspan> <tspan fill="#f1fa8c">&quot;.&quot;</tspan>
</text><text x="20.00px" y="171.20px" xml:space="preserve">
</text><text x="20.00px" y="188.00px" xml:space="preserve"><tspan fill="#50fa7b">main</tspan> <tspan fill="#ff79c6">::</tspan> <tspan fill="#8be9fd">IO</tspan> <tspan fill="#8be9fd" font-style="italic">()</tspan>
</text><text x="20.00px" y="204.80px" xml:space="preserve"><tspan fill="#50fa7b">main</tspan> <tspan fill="#ff79c6">=</tspan>
</text><text x="20.00px" y="221.60px" xml:space="preserve">  map hello [ <tspan fill="#f1fa8c">&quot;artichoke&quot;</tspan>, <tspan fill="#f1fa8c">&quot;alcachofa&quot;</tspan> ] <tspan fill="#ff79c6">&amp;</tspan> intercalate <tspan fill="#f1fa8c">&quot;</tspan><tspan fill="#f1fa8c">\n</tspan><tspan fill="#f1fa8c">&quot;</tspan> <tspan fill="#ff79c6">&amp;</tspan> putStrLn
</text><text x="20.00px" y="238.40px" xml:space="preserve">
</text><text x="20.00px" y="255.20px" xml:space="preserve"><tspan fill="#6272a4">-- Alcachofa, if you were wondering, is artichoke in Spanish.</tspan>
